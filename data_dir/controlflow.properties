#
# server limits
# built with the help of Gemini
#

#1. Global & Timeout Safeguards
timeout=10
ows.global=10

#2. Map Rendering & Cache Boost
gwc.seed=4
ows.gwc=64
ows.wms.getmap=60
ows.wms.gettile=80
ows.wfs.getfeature=15
ows.wfs.getfeature.queue=30

#3. User and IP Limits (Fixed the Bottlenecks)
user=30
ip=50

#4. Rate Throttling (Speed Limits)
user.ows.wms.getmap=30/s
user.ows.wps.execute=1000/d;30s
ows.wfs.getfeature.application/msexcel=3
